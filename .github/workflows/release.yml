name: Release
on:
  release:
    types: [published]

env:
  DIR: prod
  AWS_ACCESS_KEY: ${{ secrets.PROD_AWS_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}

jobs:
  check-format:
    runs-on: ubuntu-latest
    container: hashicorp/terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

  validate:
    needs: check-format
    runs-on: ubuntu-latest
    container: hashicorp/terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Terraform Cloud login
        run: |
          mkdir -p ~/.terraform.d
          cat > ~/.terraform.d/credentials.tfrc.json << EOL
          {
            "credentials": {
              "app.terraform.io": {
                "token": "${{ secrets.TF_CLOUD_TOKEN }}"
              }
            }
          }
          EOL
      - name: Terraform Init
        run: terraform init -upgrade
      - name: Terraform Validate
        run: terraform validate
      - name: Terraform Plan
        run: terraform plan -out=plan.out

  plan:
    needs: validate
    runs-on: ubuntu-latest
    container: hashicorp/terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Terraform Cloud login
        run: |
          mkdir -p ~/.terraform.d
          cat > ~/.terraform.d/credentials.tfrc.json << EOL
          {
            "credentials": {
              "app.terraform.io": {
                "token": "${{ secrets.TF_CLOUD_TOKEN }}"
              }
            }
          }
          EOL
      - name: Terraform Init
        run: terraform init -upgrade
      - name: Terraform Plan
        run: terraform plan -out=plan.out
      - name: Upload the plan output
        uses: actions/upload-artifact@v3
        with:
          name: plan
          path: plan.out

  apply:
    needs: plan
    runs-on: ubuntu-latest
    container: hashicorp/terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download plan output
        uses: actions/download-artifact@v3
        with:
          name: plan
          path: plan.out
      - name: Terraform Cloud login
        run: |
          mkdir -p ~/.terraform.d
          cat > ~/.terraform.d/credentials.tfrc.json << EOL
          {
            "credentials": {
              "app.terraform.io": {
                "token": "${{ secrets.TF_CLOUD_TOKEN }}"
              }
            }
          }
          EOL
      - name: Terraform Init
        run: terraform init -upgrade
      - name: Terraform Apply
        run: terraform apply plan.out
